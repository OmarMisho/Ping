name: saferch_app
description: SafeReach - Emergency Contact System App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # State Management
  provider: ^6.1.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
